name: CI Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        
      - name: Install uv 
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      
      - name: Install dependencies without wxpython
        run: |
          uv sync --frozen --no-install-package wxpython


      - name: Run formatter check
        run: |
          uv run --no-sync ruff check --select I src tests examples
          uv run --no-sync ruff format --check src tests examples

      - name: Run linter
        run: |
          uv run --no-sync ruff check src tests examples
          uv run --no-sync ruff check --select I src tests examples

      - name: Run type checker
        run: uv run --no-sync ty check --exclude src/scadview/ui/wx --force-exclude

      - name: Run tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: uv run --no-sync pytest -p no:pytestqt -p pytest_cov
