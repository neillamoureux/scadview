name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v prefix (e.g. 0.2.7). Optional for manual runs."
        required: false
        type: string
      publish:
        description: "Publish package to PyPI"
        required: false
        default: true
        type: boolean
      deploy_docs:
        description: "Deploy docs to gh-pages with mike"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: "release-${{ github.event.release.tag_name || github.ref_name }}"
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Build package
        run: uv build

      - name: Publish package
        run: uv publish --trusted-publishing=always

  docs:
    if: (github.event_name == 'release' || (inputs.deploy_docs && inputs.version != '')) && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    needs: publish
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ inputs.version || github.event.release.tag_name }}
